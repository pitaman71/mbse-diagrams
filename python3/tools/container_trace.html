<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Trace</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d3; --slot: #eeeeea;
  --cell: #ffffff; --accent: #2f6fd6; --hl: #fff2c2; --hl-line: #d9a400; --gone: #c8372d; --kept: #2f6fd6;
  --ignored: #c8372d; --ok: #2b8a3e; --code: #f1f1ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ececea; --muted: #9a9a94; --line: #3a3a37; --slot: #222220;
    --cell: #262624; --accent: #6ea2ff; --hl: #4a3d10; --hl-line: #e0b62e; --gone: #ff7b70; --kept: #6ea2ff;
    --ignored: #ff7b70; --ok: #5fcf78; --code: #262624;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ececea; --muted: #9a9a94; --line: #3a3a37; --slot: #222220;
  --cell: #262624; --accent: #6ea2ff; --hl: #4a3d10; --hl-line: #e0b62e; --gone: #ff7b70; --kept: #6ea2ff;
  --ignored: #ff7b70; --ok: #5fcf78; --code: #262624;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
nav h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
nav .notebook { padding: 10px 16px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit;
  padding: 5px 16px; cursor: pointer; }
nav button:hover { background: var(--slot); }
nav button.on { background: var(--accent); color: #fff; }
nav button .n { float: right; opacity: .7; font-size: 12px; font-variant-numeric: tabular-nums; }
main { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; min-height: 0; }
header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
header h2 { margin: 0; font-size: 15px; }
header .case { color: var(--muted); flex: 1 1 300px; }
header button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); color: inherit;
  border-radius: 6px; cursor: pointer; }
header button:disabled { opacity: .4; cursor: default; }
header .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
.columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px; min-height: 0; }
.column { display: grid; grid-template-rows: 3fr 1fr; gap: 10px; min-height: 0; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; min-height: 0; }
.panel h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tree { list-style: none; margin: 0; padding: 0; font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.hl { background: var(--hl); outline: 1px solid var(--hl-line); border-radius: 3px; padding: 0 2px; }
.gone { color: var(--gone); text-decoration: line-through; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; font: 12px/1.5 ui-monospace, monospace; }
th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-family: system-ui, sans-serif; }
tr.ignored td { color: var(--ignored); }
tr.hl td, td.hl { background: var(--hl); }
.change .what { font: 15px/1.4 ui-monospace, monospace; }
.change .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
.badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; color: #fff; margin-left: 6px; font-family: system-ui, sans-serif; }
.badge.held, .badge.met { background: var(--ok); }
.badge.ignored, .badge.dropped, .badge.error { background: var(--ignored); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
pre { background: var(--code); padding: 6px 8px; border-radius: 6px; font-size: 11px; max-height: 140px; overflow: auto; margin: 4px 0 0; }
svg { display: block; max-width: 100%; height: auto; }
.timeline { border-bottom: 1px solid var(--line); max-height: 132px; overflow-y: auto; padding: 6px 14px; }
.timeline .row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 2px 0; }
.timeline .row .m { flex: 0 0 auto; min-width: 230px; max-width: 320px; color: var(--muted); font: 12px ui-monospace, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.timeline .row.on .m { color: var(--ink); font-weight: 700; }
.chip { font: 11px system-ui, sans-serif; padding: 1px 7px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: inherit; cursor: pointer; }
.chip.placement { border-style: dashed; }
.chip.refused { color: var(--ignored); border-color: var(--ignored); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; border-style: solid; }
.toggle { display: inline-flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: -3px 0 8px; }
.toggle button { font: 600 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; padding: 4px 10px;
  border: 0; background: none; color: var(--muted); cursor: pointer; }
.toggle button.on { background: var(--accent); color: #fff; }
#layout-panel { display: flex; flex-direction: column; }
#layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
svg.physical { flex: 1; min-height: 0; width: 100%; height: 100%; } /* scaled to the panel, both ways */
.legend { color: var(--muted); font-size: 11px; margin-top: 6px; }
@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; height: auto; }
  nav { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .columns { grid-template-columns: 1fr; }
  .column { grid-template-rows: auto auto; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"><h1>Layout trace</h1></nav>
  <main>
    <header>
      <h2 id="title"></h2><span class="case" id="case"></span>
      <button id="prev" title="Previous pass (←); ↑ the previous mutation">←</button>
      <button id="next" title="Next pass (→); ↓ the next mutation">→</button>
      <span class="pos" id="pos"></span>
    </header>
    <div class="timeline" id="timeline" aria-label="the case's mutations, each with its passes"></div>
    <div class="columns">
      <div class="column">
        <section class="panel"><h3>Data model</h3><div id="data"></div></section>
        <section class="panel change"><h3>Mutation</h3><div id="mutation"></div></section>
      </div>
      <div class="column">
        <section class="panel"><h3>Container model</h3><div id="model"></div></section>
        <section class="panel change"><h3>Adjustment</h3><div id="adjustment"></div></section>
      </div>
      <div class="column">
        <section class="panel" id="layout-panel">
          <div class="toggle" role="group" aria-label="the layout shown">
            <button id="show-container" aria-pressed="true">Container layout</button>
            <button id="show-physical" aria-pressed="false">Physical layout</button>
          </div>
          <div id="layout"></div>
        </section>
        <section class="panel change"><h3 id="effect-title">Effect on the layout</h3><div id="effect"></div></section>
      </div>
    </div>
  </main>
</div>
<script>
const TRACE = /*TRACE*/null;
// A position is a case, a mutation in it, and one of that mutation's passes: each of the container layout's adjustments,
// in order, then, where the bench places, placement; a mutation with neither is shown once.
const cases = [];
for (const nb of TRACE.notebooks) for (const c of nb.cases) cases.push({ nb, c });
let at = { k: 0, m: 0, a: 0 };
const places = (step) => step.placed !== null;
const count = (step) => Math.max(step.adjustments.length + (places(step) ? 1 : 0), 1);
const isPlacement = (step, a) => places(step) && a === step.adjustments.length;

const nav = document.getElementById("nav");
let last = null;
cases.forEach(({ nb, c }, k) => {
  if (nb !== last) {
    const d = document.createElement("div");
    d.className = "notebook"; d.textContent = nb.title; nav.appendChild(d); last = nb;
  }
  const b = document.createElement("button");
  b.innerHTML = `${c.id} <span class="n">${c.steps.length}</span>`;
  b.title = c.title; b.dataset.k = k; b.onclick = () => go({ k, m: 0, a: 0 });
  nav.appendChild(b);
});

const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
const pos = (p) => `(${p[0]},${p[1]})`;
const cellKey = (p) => `${p[0]},${p[1]}`;
const quarter = (d) => ["north", "east", "south", "west"][Math.floor(((((d % 360) + 360) % 360) + 45) / 90) % 4];

function adjustmentText(a) {
  if (!a) return '<span class="empty">none: the container layout does not follow this mutation</span>';
  switch (a.kind) {
    case "grid": return `grid made: ${a.span} wide, growing ${a.grows}, its cells turned ${a.cell_rotation}°`;
    case "rotate": return `cells turned to ${a.degrees}°`;
    case "place": return `place <b>${esc(a.shape)}</b> in ${pos(a.to)}, its order ${a.order}`;
    case "move": return `move <b>${esc(a.shape)}</b> ${pos(a.from)} → ${pos(a.to)}`;
    case "leave": return `<b>${esc(a.shape)}</b> leaves ${pos(a.from)}`;
    case "rule": return `rule ${esc(a.from_shape)} → ${esc(a.to_shape)}, ${a.degrees}° ${quarter(a.degrees)}<span class="badge ${a.status}">${a.status}</span>`;
    case "extents": return `extents now ${a.rows} × ${a.columns}`;
  }
  return esc(JSON.stringify(a));
}

function chipText(a) {
  switch (a.kind) {
    case "grid": return "grid made";
    case "rotate": return `turn ${a.degrees}°`;
    case "place": return `place ${a.shape} ${pos(a.to)}`;
    case "move": return `move ${a.shape} ${pos(a.to)}`;
    case "leave": return `${a.shape} leaves`;
    case "rule": return `rule ${a.from_shape}→${a.to_shape} ${a.status}`;
    case "extents": return `extents ${a.rows}×${a.columns}`;
  }
  return a.kind;
}

function timelineView() {
  const { c } = cases[at.k];
  let html = "";
  c.steps.forEach((step, m) => {
    html += `<div class="row${m === at.m ? " on" : ""}"><span class="m" data-m="${m}" title="${esc(step.mutation)}">${m + 1}. ${esc(step.mutation)}</span>`;
    const chip = (a, label, cls) => `<button class="chip ${cls}${m === at.m && a === at.a ? " on" : ""}" data-m="${m}" data-a="${a}">${esc(label)}</button>`;
    if (step.error) html += chip(0, "refused", "refused");
    else step.adjustments.forEach((adj, a) => { html += chip(a, chipText(adj), ""); });
    if (places(step)) {
      const n = step.placed.length;
      html += chip(step.adjustments.length, n ? `placement · ${n} written` : "placement · nothing moved", "placement");
    } else if (!step.adjustments.length && !step.error) html += chip(0, "no adjustments", "");
    html += "</div>";
  });
  const t = document.getElementById("timeline");
  t.innerHTML = html;
  for (const el of t.querySelectorAll("[data-m]")) {
    el.onclick = () => go({ k: at.k, m: +el.dataset.m, a: el.dataset.a === undefined ? 0 : +el.dataset.a });
  }
  const on = t.querySelector(".chip.on") || t.querySelector(".row.on");
  if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function effectText(a, state) {
  if (!a) return '<span class="empty">the layout is unchanged</span>';
  switch (a.kind) {
    case "grid": return "an empty grid appears";
    case "rotate": return `the grid's cells, and the shapes in them, turn to ${a.degrees}° from the container's compass`;
    case "place": return `${esc(a.shape)} appears at ${pos(a.to)}`;
    case "move": {
      const shared = state && (state.cells[cellKey(a.to)] || []).length > 1;
      return `${esc(a.shape)} moves from ${pos(a.from)} to ${pos(a.to)}${shared ? ", sharing that cell" : ""}`;
    }
    case "leave": return `${esc(a.shape)} disappears from ${pos(a.from)}`;
    case "rule":
      return { held: "a solid arrow appears: the rule holds where its shapes already are",
               met: "the arrow is solid: the moves before this one met the rule",
               ignored: "a dashed arrow points where the rule wants its shape: ignored, and queued",
               dropped: "the rule's arrow goes" }[a.status];
    case "extents": return `the grid is now ${a.rows} rows by ${a.columns} columns`;
  }
  return "";
}

function dataView(before, after) {
  const shown = after || before;
  if (!shown) return '<p class="empty">no container yet</p>';
  const was = new Map((before ? before.children : []).map((c) => [c.name, c]));
  const now = new Map((after ? after.children : []).map((c) => [c.name, c]));
  const names = (after ? after.children : []).map((c) => c.name);
  (before ? before.children : []).forEach((c, i) => { if (!now.has(c.name)) names.splice(i, 0, c.name); });
  const specKey = (s) => `${s.to}|${s.degrees}`;
  let html = `<ul class="tree"><li><b>${esc(shown.container)}</b> <span class="muted">· its children, in order</span><ul>`;
  if (!names.length) html += '<li class="empty">none</li>';
  for (const name of names) {
    const b = was.get(name), a = now.get(name);
    html += `<li><span class="${!b ? "hl" : !a ? "gone" : ""}">${esc(name)}</span>`;
    const specs = new Map([...(b ? b.specs : []), ...(a ? a.specs : [])].map((s) => [specKey(s), s]));
    if (specs.size) {
      html += "<ul>";
      for (const [key, s] of specs) {
        const inB = b && b.specs.some((x) => specKey(x) === key), inA = a && a.specs.some((x) => specKey(x) === key);
        html += `<li><span class="${!inB ? "hl" : !inA ? "gone" : ""}">spec → ${esc(s.to)} <span class="muted">${s.degrees}° ${s.side}</span></span></li>`;
      }
      html += "</ul>";
    }
    html += "</li>";
  }
  return html + "</ul></li></ul>";
}

function touched(a) {
  const cells = new Set(), shapes = new Set();
  if (!a) return { cells, shapes, rule: null, grid: false };
  for (const p of [a.from, a.to]) if (p) cells.add(cellKey(p));
  if (a.shape && a.kind !== "grid") shapes.add(a.shape);
  return { cells, shapes, rule: a.kind === "rule" ? [a.from_shape, a.to_shape, a.degrees] : null,
           grid: ["grid", "extents", "rotate"].includes(a.kind) };
}

function modelView(state, a) {
  if (!state) return '<p class="empty">no grid</p>';
  const t = touched(a);
  let html = `<table><tr><th>grid</th><td class="${t.grid ? "hl" : ""}">grows ${state.grows}, span ${state.span}<br>` +
    `extents ${state.rows} × ${state.columns} · ${state.inserted} inserted<br>cells turned ${state.cell_rotation}°</td></tr></table>`;
  const keys = Object.keys(state.cells).sort((x, y) => {
    const [r1, c1] = x.split(",").map(Number), [r2, c2] = y.split(",").map(Number);
    return r1 - r2 || c1 - c2;
  });
  html += '<h3 style="margin-top:12px">Cells</h3>';
  if (!keys.length) html += '<p class="empty">none</p>';
  else {
    html += "<table><tr><th>cell</th><th>holds, with each one's order</th><th>as a container</th></tr>";
    for (const key of keys) {
      const held = state.cells[key];
      const axis = held.length > 1 ? `grows ${state.grows}, ${state.grows === "rows" ? held.length + " × 1" : "1 × " + held.length}` : "";
      const shapes = held.map(([n, o]) => `${t.shapes.has(n) ? "<b>" + esc(n) + "</b>" : esc(n)} <span class="muted">${o}</span>`).join(", ");
      html += `<tr class="${t.cells.has(key) ? "hl" : ""}"><td>(${key})</td><td>${shapes}</td><td>${axis}</td></tr>`;
    }
    html += "</table>";
  }
  html += '<h3 style="margin-top:12px">Rules, in the order they reached the grid</h3>';
  if (!state.rules.length) html += '<p class="empty">none</p>';
  else {
    html += "<table><tr><th>#</th><th>rule</th><th></th></tr>";
    state.rules.forEach((r, i) => {
      const on = t.rule && r[0] === t.rule[0] && r[1] === t.rule[1] && r[2] === t.rule[2];
      html += `<tr class="${r[3] ? "ignored" : ""}${on ? " hl" : ""}"><td>${i + 1}</td><td>${esc(r[0])} → ${esc(r[1])}, ${r[2]}° ${quarter(r[2])}</td><td>${r[3] ? "ignored" : "holds"}</td></tr>`;
    });
    html += "</table>";
  }
  return html;
}

const W = 92, H = 56, G = 12, P = 46;
const SIDES = { north: [0, -1], east: [1, 0], south: [0, 1], west: [-1, 0] };

function layoutView(state, a) {
  if (!state) return '<p class="empty">no grid</p>';
  const t = touched(a);
  const placed = Object.keys(state.cells).map((k) => k.split(",").map(Number));
  const rows = Math.max(state.rows, ...placed.map((p) => p[0] + 1), 1);
  const cols = Math.max(state.columns, ...placed.map((p) => p[1] + 1), 1);
  const w = P * 2 + cols * W + (cols - 1) * G, h = P * 2 + rows * H + (rows - 1) * G;
  const x = (c) => P + c * (W + G), y = (r) => P + r * (H + G);
  const where = new Map();
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="the container layout">`;
  svg += "<defs>" + ["kept", "ignored"].map((k) => `<marker id="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--${k})"/></marker>`).join("") + "</defs>";
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = t.cells.has(`${r},${c}`) && !state.cells[`${r},${c}`];
    svg += `<rect x="${x(c)}" y="${y(r)}" width="${W}" height="${H}" rx="6" fill="var(--slot)" stroke="${on ? "var(--hl-line)" : "none"}" stroke-width="2" stroke-dasharray="${on ? "4 3" : "0"}"/>`;
  }
  for (const [key, held] of Object.entries(state.cells)) {
    const [r, c] = key.split(",").map(Number);
    const on = t.cells.has(key);
    svg += `<rect x="${x(c)}" y="${y(r)}" width="${W}" height="${H}" rx="6" fill="${on ? "var(--hl)" : "var(--cell)"}" stroke="${on ? "var(--hl-line)" : "var(--line)"}" stroke-width="${on ? 2 : 1}"/>`;
    svg += `<text x="${x(c) + 5}" y="${y(r) + 11}" fill="var(--muted)" font-size="9">${r},${c}</text>`;
    const n = held.length, down = state.grows === "rows" || n === 1;
    held.forEach(([name, order], i) => {
      const cx = x(c) + (down ? W / 2 : W * (i + 0.5) / n), cy = y(r) + (down ? 10 + (H - 12) * (i + 0.5) / n : H / 2 + 4);
      where.set(name, [cx, cy]);
      svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-size="${n > 2 ? 12 : 15}" font-weight="${t.shapes.has(name) ? 800 : 600}">${esc(name)}<tspan fill="var(--muted)" font-size="10" font-weight="400"> ${order}</tspan></text>`;
    });
  }
  const stubs = new Map();
  for (const [from, to, degrees, ignored] of state.rules) {
    const p = where.get(from), q = where.get(to);
    if (!p || !q) continue;
    const side = quarter(degrees);
    const on = t.rule && t.rule[0] === from && t.rule[1] === to && t.rule[2] === degrees;
    if (ignored) { // where the rule wants its shape, not where it is
      const [ux, uy] = SIDES[side];
      const n = stubs.get(from + side) || 0; stubs.set(from + side, n + 1);
      const off = (n % 2 ? -1 : 1) * Math.ceil(n / 2) * 9;
      const [sx, sy] = [p[0] + ux * 16 - uy * off, p[1] + uy * 16 + ux * off];
      const reach = ux ? W / 2 + G / 2 : H / 2 + G / 2;
      const [ex, ey] = [sx + ux * reach, sy + uy * reach];
      svg += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--ignored)" stroke-width="${on ? 3 : 2}" stroke-dasharray="4 3" marker-end="url(#arrow-ignored)"><title>${esc(from)} → ${esc(to)}: ${side}, ignored</title></line>`;
      svg += `<text x="${ex + ux * 8 + (ux ? 0 : 6)}" y="${ey + uy * 10 + (uy ? 0 : -4)}" text-anchor="${ux < 0 ? "end" : "start"}" fill="var(--ignored)" font-size="11" font-weight="600">${esc(to)}</text>`;
      continue;
    }
    const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1, s = 16;
    svg += `<line x1="${p[0] + dx / len * s}" y1="${p[1] + dy / len * s}" x2="${q[0] - dx / len * s}" y2="${q[1] - dy / len * s}" stroke="var(--kept)" stroke-width="${on ? 3 : 2}" marker-end="url(#arrow-kept)"><title>${esc(from)} → ${esc(to)}: ${side}</title></line>`;
  }
  return svg + "</svg>";
}

// --- the physical layout: frames and points at their coordinates, in diagram units, scaled to the panel ---

let mode = "container";
try { if (localStorage.getItem("container-trace-mode") === "physical") mode = "physical"; } catch (e) { /* none */ }

const num = (v) => (Math.round(v * 1000) / 1000).toString();
const sameItem = (x, y) => x && y && JSON.stringify([x.at, x.size, x.direction]) === JSON.stringify([y.at, y.size, y.direction]);

function changedKeys(before, after) {
  const was = new Map((before || []).map((i) => [i.key, i]));
  return new Set((after || []).filter((i) => !sameItem(was.get(i.key), i)).map((i) => i.key));
}

function physicalView(items, changed) {
  if (!items) return '<p class="empty">this bench does not place</p>';
  if (!items.length) return '<p class="empty">nothing placed yet</p>';
  const frames = items.filter((i) => i.size);
  const xs = items.flatMap((i) => (i.size ? [i.at[0], i.at[0] + i.size[0]] : [i.at[0]]));
  const ys = items.flatMap((i) => (i.size ? [i.at[1], i.at[1] + i.size[1]] : [i.at[1]]));
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const span = Math.max(x1 - x0, y1 - y0, 1), pad = span * 0.06;
  const font = span * 0.03, dot = span * 0.009;
  let svg = `<svg class="physical" viewBox="${x0 - pad} ${y0 - pad} ${x1 - x0 + 2 * pad} ${y1 - y0 + 2 * pad}" role="img" aria-label="the physical layout">`;
  const rect = (i, fill, stroke, dash, width) => {
    const on = changed.has(i.key); // highlighted by its outline, so that what it holds stays in view
    return `<rect x="${i.at[0]}" y="${i.at[1]}" width="${i.size[0]}" height="${i.size[1]}" fill="${fill}" ` +
      `stroke="${on ? "var(--hl-line)" : stroke}" stroke-width="${on ? width + 1.5 : width}" stroke-dasharray="${on ? "0" : dash}" vector-effect="non-scaling-stroke">` +
      `<title>${esc(i.key || "the diagram")}: at (${num(i.at[0])}, ${num(i.at[1])}), ${num(i.size[0])} × ${num(i.size[1])}</title></rect>`;
  };
  const STYLE = { diagram: ["none", "var(--line)", "0", 1], grid: ["none", "var(--muted)", "3 3", 1],
                  cell: ["var(--slot)", "none", "0", 1], shape: ["none", "var(--ink)", "0", 1.5] };
  for (const i of frames) { // in the diagram's own order: each container before what it holds
    svg += rect(i, ...STYLE[i.kind]);
    if (i.kind === "shape") { // its title, in the band its layout keeps for it: as high as the band, less a little
      const band = i.title || font;
      svg += `<text x="${i.at[0] + i.size[0] / 2}" y="${i.at[1] + band * 0.78}" text-anchor="middle" font-size="${band * 0.8}" fill="${changed.has(i.key) ? "var(--hl-line)" : "var(--ink)"}" font-weight="${changed.has(i.key) ? 800 : 600}">${esc(i.label)}</text>`;
    }
  }
  for (const i of items.filter((p) => p.kind === "point")) {
    const on = changed.has(i.key), r = i.role === "origin" ? dot * 1.5 : dot;
    const rad = (i.direction * Math.PI) / 180, tick = dot * 3.5;
    const colour = on ? "var(--hl-line)" : i.role === "origin" ? "var(--accent)" : "var(--ink)";
    svg += `<line x1="${i.at[0]}" y1="${i.at[1]}" x2="${i.at[0] + Math.sin(rad) * tick}" y2="${i.at[1] - Math.cos(rad) * tick}" stroke="${colour}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    svg += `<circle cx="${i.at[0]}" cy="${i.at[1]}" r="${r}" fill="${colour}"><title>${esc(i.key)}: at (${num(i.at[0])}, ${num(i.at[1])}), facing ${num(i.direction)}°</title></circle>`;
  }
  const diagram = frames.find((f) => f.kind === "diagram");
  return svg + "</svg>" + `<div class="legend">${diagram ? `the diagram, ${num(diagram.size[0])} × ${num(diagram.size[1])} units · ` : ""}` +
    "shapes outlined, grids dashed, cells shaded; each point's tick shows its direction, origins in blue; what this step moved is highlighted</div>";
}

function placedText(step, placing) {
  if (step.placed === null) return '<span class="empty">this bench does not place</span>';
  if (!placing) return `<span class="empty">placement is this mutation's last pass, after the container layout's ${step.adjustments.length} adjustment${step.adjustments.length === 1 ? "" : "s"}: until then, the layout as it was</span>`;
  if (!step.placed.length) return '<span class="empty">nothing moved: placement wrote nothing</span>';
  let html = `<div class="sub" style="margin:0 0 6px">one mutation, an upsert of ${step.placed.length} annotation${step.placed.length > 1 ? "s" : ""}</div>`;
  html += "<table><tr><th>of</th><th></th><th>absolute</th><th>size or direction</th></tr>";
  for (const row of step.placed) {
    const [of, kind, absolute] = row;
    const rest = kind === "frame" ? `${num(row[4][0])} × ${num(row[4][1])}` : `${num(row[4])}°`;
    html += `<tr><td>${esc(of)}</td><td class="muted">${kind}</td><td>(${num(absolute[0])}, ${num(absolute[1])})</td><td>${rest}</td></tr>`;
  }
  return html + "</table>";
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem("container-trace-mode", m); } catch (e) { /* storage unavailable */ }
  show();
}
document.getElementById("show-container").onclick = () => setMode("container");
document.getElementById("show-physical").onclick = () => setMode("physical");

function show() {
  const { nb, c } = cases[at.k], step = c.steps[at.m];
  const placing = isPlacement(step, at.a);
  const a = placing ? null : step.adjustments[at.a] || null;
  const state = step.adjustments.length ? step.states[Math.min(at.a, step.adjustments.length - 1)] : step.model_before;
  document.getElementById("title").textContent = nb.title;
  document.getElementById("case").textContent = `${c.id} · ${c.title}`;
  document.getElementById("pos").textContent = `mutation ${at.m + 1} of ${c.steps.length} · pass ${at.a + 1} of ${count(step)}: ` +
    (placing ? "placement" : step.adjustments.length ? `adjustment ${at.a + 1} of ${step.adjustments.length}` : "no adjustments");
  document.getElementById("data").innerHTML = dataView(step.data_before, step.data_after);
  document.getElementById("mutation").innerHTML = `<div class="what">${esc(step.mutation)}</div>` +
    (step.kind === "unchild" || step.kind === "move" ? '<div class="sub">anticipated: the container layout adjusts first, then places the shape where it went</div>' : "") +
    `<details><summary>the transaction expression, as journalled</summary><pre>${esc(JSON.stringify(step.expression, null, 1))}</pre></details>`;
  document.getElementById("model").innerHTML = modelView(state, a);
  document.getElementById("adjustment").innerHTML = step.error
    ? `<div class="what">refused<span class="badge error">error</span></div><div class="sub">${esc(step.error)}</div>`
    : placing ? `<div class="what">placement</div><div class="sub">the container layout has made its ${step.adjustments.length} adjustment${step.adjustments.length === 1 ? "" : "s"}; physical layout follows the mutation once</div>`
    : `<div class="what">${adjustmentText(a)}</div>` +
      (step.adjustments.length ? `<div class="sub">${at.a + 1} of ${step.adjustments.length} for this mutation</div>` : "");
  for (const [id, m] of [["show-container", "container"], ["show-physical", "physical"]]) {
    const b = document.getElementById(id);
    b.classList.toggle("on", mode === m); b.setAttribute("aria-pressed", String(mode === m));
  }
  if (mode === "physical") { // placement is the mutation's last pass: the layout as it was until then
    document.getElementById("layout").innerHTML = placing
      ? physicalView(step.physical_after, changedKeys(step.physical_before, step.physical_after))
      : physicalView(step.physical_before, new Set());
    document.getElementById("effect-title").textContent = "Placement";
    document.getElementById("effect").innerHTML = placedText(step, placing);
  } else {
    document.getElementById("layout").innerHTML = layoutView(state, a);
    document.getElementById("effect-title").textContent = "Effect on the layout";
    document.getElementById("effect").innerHTML = step.error ? '<span class="empty">the layout is unchanged</span>'
      : placing ? '<span class="empty">the container layout is settled; placement gives it coordinates: see the physical layout</span>'
      : effectText(a, state);
  }
  const lastCase = at.k === cases.length - 1, lastStep = at.m === c.steps.length - 1;
  document.getElementById("prev").disabled = at.k === 0 && at.m === 0 && at.a === 0;
  document.getElementById("next").disabled = lastCase && lastStep && at.a === count(step) - 1;
  for (const b of nav.querySelectorAll("button")) b.classList.toggle("on", +b.dataset.k === at.k);
  timelineView();
  try { localStorage.setItem("container-trace-3", JSON.stringify(at)); } catch (e) { /* storage unavailable */ }
}

function go(p) {
  at = p; show();
  const b = nav.querySelector(`button[data-k="${p.k}"]`);
  if (b) b.scrollIntoView({ block: "nearest" });
}
function move(d) {
  let { k, m, a } = at;
  a += d;
  if (a < 0) {
    m -= 1;
    if (m < 0) { if (k === 0) return; k -= 1; m = cases[k].c.steps.length - 1; }
    a = count(cases[k].c.steps[m]) - 1;
  } else if (a >= count(cases[k].c.steps[m])) {
    m += 1; a = 0;
    if (m >= cases[k].c.steps.length) { if (k === cases.length - 1) return; k += 1; m = 0; }
  }
  go({ k, m, a });
}
function jump(d) {
  let { k, m } = at;
  m += d;
  if (m < 0) { if (k === 0) return; k -= 1; m = cases[k].c.steps.length - 1; }
  if (m >= cases[k].c.steps.length) { if (k === cases.length - 1) return; k += 1; m = 0; }
  go({ k, m, a: 0 });
}
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.addEventListener("keydown", (e) => {
  const keys = { ArrowRight: () => move(1), ArrowLeft: () => move(-1), ArrowDown: () => jump(1), ArrowUp: () => jump(-1),
    PageDown: () => at.k < cases.length - 1 && go({ k: at.k + 1, m: 0, a: 0 }),
    PageUp: () => at.k > 0 && go({ k: at.k - 1, m: 0, a: 0 }) };
  if (keys[e.key]) { keys[e.key](); e.preventDefault(); }
});
try {
  const saved = JSON.parse(localStorage.getItem("container-trace-3"));
  if (saved && cases[saved.k] && cases[saved.k].c.steps[saved.m] && saved.a < count(cases[saved.k].c.steps[saved.m])) at = saved;
} catch (e) { /* storage unavailable */ }
show();
</script>
</body>
</html>
